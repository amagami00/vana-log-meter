<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- vana-log-meter のアイコン。オリジナルの図案（クリスタルとダメージの棒グラフ）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3170"/>
      <stop offset="1" stop-color="#0b1330"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#c58a2a"/>
    </linearGradient>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#plate)">
    <!-- 棒グラフ -->
    <g fill="url(#gold)">
      <rect x="586" y="664" width="54" height="146" rx="10"/>
      <rect x="656" y="572" width="54" height="238" rx="10"/>
      <rect x="726" y="462" width="54" height="348" rx="10"/>
      <rect x="796" y="330" width="54" height="480" rx="10"/>
    </g>
    <!-- クリスタル -->
    <circle cx="410" cy="500" r="300" fill="url(#halo)"/>
    <polygon points="410,170 255,470 390,500" fill="#bfeaff"/>
    <polygon points="410,170 390,500 565,470" fill="#7cc8f2"/>
    <polygon points="255,470 410,820 390,500" fill="#4c9fd6"/>
    <polygon points="390,500 410,820 565,470" fill="#2f74b5"/>
    <polygon points="410,170 330,330 390,500 400,300" fill="#ffffff" opacity="0.45"/>
    <polyline points="410,170 255,470 410,820 565,470 410,170" fill="none" stroke="#e6f7ff" stroke-width="6" stroke-linejoin="round" opacity="0.8"/>
    <!-- きらめき -->
    <path d="M250 250 l12 34 34 12 -34 12 -12 34 -12 -34 -34 -12 34 -12z" fill="#ffffff" opacity="0.9"/>
    <path d="M560 230 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
